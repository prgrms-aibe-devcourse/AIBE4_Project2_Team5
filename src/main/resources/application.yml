spring:
  application:
    name: eolmago
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1740000
      keepalive-time: 120000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao

          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,logfile,loggers
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[auction.bid.duration]": true
        "[auction.bid.lock.wait]": true
        "[auction.bid.lock.hold]": true
        "[auction.bid.transaction.duration]": true
        "[auction.close.duration]": true
        "[auction.close.delay]": true
      slo:
        "[auction.bid.duration]": [50ms, 100ms, 250ms, 500ms, 1s, 2s, 3s]
        "[auction.bid.lock.wait]": [5ms, 10ms, 25ms, 50ms, 100ms, 150ms, 250ms]
        "[auction.bid.lock.hold]": [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s]
        "[auction.bid.transaction.duration]": [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]

auction:
  runtime:
    bid:
      lock-timeout-ms: 150
      transaction-timeout-sec: 3
    close:
      lock-timeout-ms: 200
      transaction-timeout-sec: 5
    scheduler:
      pool-size: 10
      thread-name-prefix: auction-close-
      await-termination-sec: 30
      sweep-delay-ms: 60000
      sweep-batch-size: 100

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-minimum-256-bits-required}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:90000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  bucket: ${SUPABASE_BUCKET:eolmago}

coolsms:
  apiKey: ${COOLSMS_API_KEY:}
  secretkey: ${COOLSMS_SECRET_KEY:}
  from:
    number: ${COOLSMS_FROM_NUMBER:}

chat:
  notification-bot-user-id: ${CHAT_NOTIFICATION_BOT_USER_ID:00000000-0000-0000-0000-000000000001}

logging:
  file:
    name: ${APP_LOG_FILE:./logs/eolmago.log}
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB